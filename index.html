<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Weather Almanac · Pixel Edition</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ecd9;
      --paper-2: #e6dcc1;
      --ink: #1a1612;
      --rust: #7a2f3a;
      --slate: #5a6b76;
    }
    [data-theme="dark"] {
      --paper: #14110d;
      --paper-2: #1d1915;
      --ink: #f3ecd9;
      --rust: #c45e6e;
      --slate: #8e9aa3;
    }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: "Crimson Pro", Georgia, serif; transition: background .4s, color .4s; }
    * { box-sizing: border-box; }
    canvas { display: block; }

    @keyframes almtick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes ghostsweep { 0%,100%{ opacity:.06; transform: translateY(0);} 50%{opacity:.12; transform: translateY(8px);} }
    @keyframes flicker { 0%,100%{opacity:1} 96%{opacity:.85} 97%{opacity:1} 98%{opacity:.6} }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    @keyframes drift { from { background-position: 0 0; } to { background-position: 120px 0; } }
    @keyframes appear { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .reveal { animation: appear .6s ease-out both; }

    /* Theme & unit toggles. Position is set by the parent (inline in masthead,
       or floating top-right during loading/error states). */
    .theme-toggle {
      background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 4px 10px; font-family: "VT323", monospace; font-size: 14px;
      letter-spacing: 1px; cursor: pointer; user-select: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform .12s;
      line-height: 1;
    }
    .theme-toggle:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
    .theme-toggle:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .toggle-bar {
      display: flex; gap: 8px; align-items: center;
    }
    .toggle-bar--floating {
      position: fixed; top: 14px; right: 14px; z-index: 50;
    }

    /* Subtle stipple background, painted from CSS */
    .stipple-bg {
      background-image: radial-gradient(var(--ink) 1px, transparent 1.5px);
      background-size: 14px 14px;
      opacity: .07;
      pointer-events: none;
      position: absolute; inset: 0; z-index: 0;
    }

    /* Section divider — dotted */
    .div-dot {
      height: 14px;
      background: radial-gradient(var(--ink) 1.4px, transparent 1.6px) 0 50%/16px 14px repeat-x;
      opacity: .55;
    }

    /* Mode tag chip */
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
      border: 1.5px solid var(--ink); font-family: "VT323", monospace;
      letter-spacing: 1px; font-size: 13px; line-height: 1;
    }
    .chip.rust { background: var(--rust); color: var(--paper); border-color: var(--rust); }

    /* Marquee track */
    .ticker { display: flex; gap: 22px; animation: almtick 38s linear infinite; }

    /* Make the table dotted-style */
    .almtable { width:100%; border-collapse: collapse; font-family: "VT323", monospace; font-size: 18px; }
    .almtable td { padding: 4px 0; border-bottom: 1px dotted var(--ink); }

    /* Hover gloss for stat blocks */
    .stat-block { transition: transform .15s; }
    .stat-block:hover { transform: translate(-1px,-1px); }

    /* Mode switcher (DAY IN WEATHER) buttons — let columns shrink past
       min-content so long labels never force horizontal page overflow. */
    .dw-mode-switcher button { min-width: 0; }
    .dw-mode-switcher button > div { min-width: 0; }
    .dw-mode-switcher button span { min-width: 0; overflow-wrap: anywhere; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .dw-mode-switcher { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
      .dw-story-grid { grid-template-columns: 1fr !important; gap: 14px !important; }
      .grid-broadsheet { grid-template-columns: 1fr !important; gap: 18px !important; }
      .grid-hero { grid-template-columns: 1fr !important; gap: 12px !important; text-align: center; }
      .grid-hero > * { justify-self: center; }
      .grid-celestial { grid-template-columns: 1fr !important; gap: 18px !important; }
      .grid-celestial > div:first-child { border-right: none !important; border-bottom: 1px dashed var(--ink); padding-right: 0 !important; padding-bottom: 18px; }
      .grid-instruments-1, .grid-instruments-2 { grid-template-columns: repeat(2, 1fr) !important; }
      .grid-instruments-1 > div, .grid-instruments-2 > div {
        border-right: none !important;
        border-bottom: 1px dashed var(--ink);
      }
      .grid-instruments-1 > div:nth-child(2n), .grid-instruments-2 > div:nth-child(2n) { border-right: none !important; }
      .grid-instruments-1 > div:nth-child(odd), .grid-instruments-2 > div:nth-child(odd) {
        border-right: 1px dashed var(--ink) !important;
      }
      .col-2 { column-count: 1 !important; }
      .grid-fivedays { grid-template-columns: repeat(3, 1fr) !important; row-gap: 12px; }
      .almtable td { font-size: 16px !important; }
      h1.masthead-title { font-size: clamp(32px, 10vw, 72px) !important; letter-spacing: 2px !important; }
      h1.hero-temp { font-size: clamp(120px, 38vw, 220px) !important; }
      .pad-section { padding-left: 14px !important; padding-right: 14px !important; }
      .ticker { font-size: 14px !important; }
      .theme-toggle { padding: 3px 8px !important; font-size: 13px !important; }
      .toggle-bar--floating { top: 8px !important; right: 8px !important; }
    }
    @media (max-width: 560px) {
      h1.masthead-title { font-size: clamp(22px, 7vw, 40px) !important; letter-spacing: 1px !important; }
      .dw-mode-switcher { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 6px !important; }
      .grid-instruments-1, .grid-instruments-2 { grid-template-columns: 1fr !important; }
      .grid-instruments-1 > div, .grid-instruments-2 > div {
        border-right: none !important;
        border-bottom: 1px dashed var(--ink) !important;
      }
      .grid-fivedays { grid-template-columns: repeat(2, 1fr) !important; }
      .grid-observations { grid-template-columns: 1fr !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="weather.js"></script>
  <script src="dither.js"></script>
  <script type="text/babel" src="instruments.jsx"></script>
  <script type="text/babel" src="scene.jsx"></script>
  <script type="text/babel" src="dayinweather.jsx"></script>
  <script type="text/babel" src="page.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
